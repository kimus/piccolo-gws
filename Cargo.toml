[package]
name = "piccolo-gws"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Google Workspace integration for Piccolo"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
wait-timeout = "0.2"
which = "6"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[[bin]]
name = "piccolo-gws"
path = "src/main.rs"
